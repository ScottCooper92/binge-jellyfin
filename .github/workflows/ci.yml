name: CI

# The gate for this repository, and the trigger for every bot in this directory:
# bot-review fires on a successful run of this workflow, author-ci-fix on a failed
# one, and author-conflicts on one completing against main. They match it by NAME,
# so renaming this workflow silently unhooks all three.
#
# Four build jobs in parallel, beside `submodule-pins` and `actionlint`, then `build`.
# `./gradlew build` runs every check `CLAUDE.md` lists under
# Gates, because the plugins wire themselves into `check` (or `app/build.gradle.kts` does it by
# hand) and `build` depends on `check`. The screenshot validation, R8, the unit tests and
# lint/detekt each take minutes, so three of the slowest pieces run as jobs of their own (`tests`, `screenshots`,
# `release`), and `checks` runs `build` with exactly those tasks excluded. Excluding, not listing:
# a gate added to `check` later lands in `checks` without anyone touching this file.
#
# `build` is the job branch protection requires, and the one the bots read through this workflow's
# conclusion. It runs after the four, `submodule-pins` and `actionlint`, passes only if all of them
# passed (the pin check passes by being skipped outside a PR, actionlint by being skipped on the
# nightly), and folds the four's report artifacts back into the one `build-reports` artifact
# author-ci-fix downloads.
#
# Deliberately NO paths-ignore. bot-review requires a
# SUCCESSFUL run of this workflow against the head, so a skipped run means a PR that
# is never reviewed. .ai/ holds the rules the bots themselves read, so a docs filter
# would bypass review on exactly the changes that most need it.
on:
  push:
    branches: [main]
  pull_request:
    # `ready_for_review` is not in the default set, and without it a PR opened as a
    # draft and later promoted never gets a first run — so bot-review, which only
    # fires on a run of this workflow completing, never sees it either.
    types: [opened, synchronize, reopened, ready_for_review]
  # A canary for what can turn the build red with no commit here: a runner image or Android
  # SDK update, a toolchain drift. Without it the next PR to run takes the blame. It builds
  # main, and the three bots skip it (see their `if:`) because there is no PR for them to act
  # on. Scheduled workflows only run on the default branch.
  schedule:
    - cron: '0 4 * * *'

# Per-ref group: a new commit on the same branch/PR cancels its superseded run. The event
# name keeps the nightly run, which shares main's ref, from cancelling or being cancelled
# by a push.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A submodule pin can be a commit that only exists on an unmerged branch of its own repo, which is
  # deliberate while `hold` gates the merge on it and a trap once `hold` comes off. binge-ci's shared
  # workflow fails a PR whose pin is not an ancestor of its submodule's default branch, unless the PR
  # carries `hold`. It does nothing outside a pull request, and `build` needs it so a red pin fails
  # the gate rather than reporting beside it. The caller grants `pull-requests: read`, which the
  # shared workflow reads the label with: a reusable workflow cannot hold more than its caller.
  submodule-pins:
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    uses: ScottCooper92/binge-ci/.github/workflows/submodule-pins.yml@c34892a468b77ebc2f92ef7ec716e27ad5c50d69 # v1.0.50
    with:
      private_submodules: homelab-core,homelab-player,binge-design-system,binge-ci
    secrets:
      REVIEWER_APP_ID: ${{ secrets.REVIEWER_APP_ID }}
      REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}

  # Decides which of the jobs below a pull request can affect, so a docs-only diff, a test-only one or a
  # follow-up that moves no frame does not pay for the whole suite (#548). The jobs it gates are skipped
  # outright, and `build` reads this job's answers to know a skip is deliberate. There is still no
  # `paths-ignore`: the required check and the bots see a green `build` either way. Push and the nightly
  # run everything, so a wrong skip is found at the next merge, never lies dormant. The rules are in
  # .github/scripts/classify-changes.sh, which this job tests before it uses it.
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      product: ${{ steps.classify.outputs.product }}
      screens: ${{ steps.classify.outputs.screens }}
      release: ${{ steps.classify.outputs.release }}
    steps:
      # The whole history, no submodules: the diff needs a merge base, and nothing here builds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test the scripts
        run: |
          .github/scripts/classify-changes.test.sh
          .github/scripts/shard-screenshots.test.sh
          .github/scripts/check-r8-names.test.sh

      - name: Classify the diff
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -o pipefail
          all() {
            printf 'product=true\nscreens=true\nrelease=true\n' >> "$GITHUB_OUTPUT"
            echo "$1: running everything." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          [ "$EVENT" = pull_request ] || all "Not a pull request"

          head="$(git rev-parse HEAD)"
          # The last commit of this PR that a whole run passed on. What changed since is all a run has to
          # vouch for: it is sound because each skip it makes is of a delta that cannot reach the job. A
          # fork's branch name is not ours, so a fork PR never borrows a green run. Without one, or when it
          # is not an ancestor of this head (a force push), the baseline is the merge base with the base
          # branch, which is the PR's own files. `head` is GitHub's merge commit, so the delta also holds what
          # the base branch gained since the fork point. That is deliberate: it covers a semantic merge
          # conflict. Do not switch to the PR head SHA to save runs.
          base=""
          if [ "$SAME_REPO" = true ]; then
            green="$(gh run list --workflow ci.yml --branch "$HEAD_REF" --event pull_request --status success --limit 5 \
              --json headSha,databaseId -q '.[] | "\(.headSha) \(.databaseId)"' 2>/dev/null || true)"
            while read -r sha run_id; do
              [ -n "$sha" ] || continue
              # A draft's run skips every job, `build` too, and may still conclude success: only a run
              # whose `build` job itself succeeded vouches for its commit.
              built="$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/jobs" \
                -q '[.jobs[] | select(.name == "build" and .conclusion == "success")] | length' 2>/dev/null || echo 0)"
              [ "$built" -gt 0 ] || continue
              if [ "$sha" != "$head" ] && git cat-file -e "$sha^{commit}" 2>/dev/null && git merge-base --is-ancestor "$sha" "$head"; then
                base="$sha"; label="its last green run ($sha)"; break
              fi
            done <<< "$green"
          fi
          if [ -z "$base" ]; then
            git fetch --no-tags origin "$BASE_REF" 2>/dev/null || true
            base="$(git merge-base "origin/$BASE_REF" "$head" 2>/dev/null || true)"
            label="the merge base ($base)"
          fi
          [ -n "$base" ] || all "No baseline to diff against"

          # --no-renames: git's default rename detection prints only the NEW path of a moved file, so a source file moved
          # into docs/ would read as documentation and skip every Gradle job. This lists both the old and the new path.
          # -z: without it git C-quotes a path with a non-ASCII character, a quote or a tab, so it would match no pattern, and
          # `release` is an allow-list, so a keep rule or build file named that way would skip the release build. With -z each
          # path is written raw and ends in a NUL, and classify-changes.sh reads it that way.
          git diff -z --name-only --no-renames "$base" "$head" > "$RUNNER_TEMP/changed.txt" || all "The diff could not be read"
          .github/scripts/classify-changes.sh "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"
          {
            echo "Diff against $label:"
            echo '```'
            tr '\0' '\n' < "$RUNNER_TEMP/changed.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # `build` minus what the three jobs below own. Everything else `check` pulls in lands here:
  # compile, lint, detekt, ktlint, the tv-material gate and the debug assemble.
  checks:
    # Skip while a PR is a draft, so a stack can be opened as drafts and promoted one at a time
    # without each queued run preempting the last. Push events to main always run — `pull_request`
    # is null there. Every job below carries the same condition, so a draft's `build` reports
    # "skipped", which author-ci-fix and bot-review both already treat as "not green".
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.product == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The contracts and SDK are a submodule (see settings.gradle.kts); without this the
      # included build is an empty directory and Gradle fails at settings evaluation. Recursive,
      # because a submodule can carry its own: binge-companions includes binge-ci's Gradle gates
      # from a binge-ci submodule, and this build includes binge-companions.
      # A read-only token, so the submodules fetch even when they are private.
      - id: submodule_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          repositories: ephyra,homelab-core,homelab-player,binge-design-system,binge-ci
          permission-contents: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.submodule_token.outputs.token }}
          submodules: recursive

      # JDK 21, matching binge-ci's ci-setup. The JDK runs the build and nothing else:
      # `jvmTarget` 17 in app/build.gradle.kts decides the bytecode, so this does not move what
      # runs on a device.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        # The one job that saves the Gradle cache. The jobs below restore it, so a push writes one copy of
        # the Gradle home (1 to 3.5 GB) rather than one per job.
        with:
          cache-cleanup: on-success

      # --continue surfaces every failure in one run rather than stopping at the first,
      # which matters most to author-ci-fix: it gets exactly one repair attempt per
      # commit, and a log showing only the first of three failures spends that attempt
      # fixing a third of the problem. Each -x names a task another job runs, with no project in front of it, so it
      # drops that task in every module, :data's included; -x also drops whatever only that task needed, which is the
      # point for assembleRelease's R8. The `release` job that runs it is skipped on a pull request that changes no
      # build file, keep rule or submodule pin (classify-changes.sh), and runs on every push to main; `build` counts a
      # skipped job as passed, so branch protection still sees it.
      # There is no release unit-test task to exclude: AGP 9 creates unit tests for the debug build
      # type only, so testDebugUnitTest is the whole suite of each module and it runs once, in `tests`. Only :app has
      # frames, so the screenshots job is the one task still named with its project.
      - name: Build and lint, less what the other jobs run
        # --stacktrace until #24 names why :app:packageDebug sometimes fails with no cause in the log.
        run: ./gradlew build --continue --stacktrace -x testDebugUnitTest -x koverVerify -x validateDebugScreenshotTest -x assembleRelease

      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-reports-checks
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/ktlint/**
            **/build/reports/detekt/**
          if-no-files-found: ignore
          retention-days: 1

  # The unit tests and the coverage floor read from them.
  tests:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.product == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # A read-only token, so the submodules fetch even when they are private.
      - id: submodule_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          repositories: ephyra,homelab-core,homelab-player,binge-design-system,binge-ci
          permission-contents: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.submodule_token.outputs.token }}
          submodules: recursive
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: true

      - name: Unit tests and coverage
        run: ./gradlew testDebugUnitTest koverVerify --continue

      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-reports-tests
          path: |
            **/build/reports/tests/**
            **/build/reports/kover/**
          if-no-files-found: ignore
          retention-days: 1

  # The screenshot frames, in shards. The plugin renders every frame in one JVM that keeps each frame's
  # native memory until it exits, so the whole suite in one JVM grew past a hosted runner's memory and
  # stalled: a job that sat to its time limit with no log (#552). Each shard renders a third of the
  # classes, chosen by .github/scripts/shard-screenshots.sh so that every class lands in exactly one
  # shard and none is ever left out, and the shards run side by side. The job's result is the shards'
  # together: one red shard is a red `screenshots`.
  screenshots:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.screens == 'true' }}
    runs-on: ubuntu-latest
    # A shard normally takes 4 to 7 minutes. A render that has not finished in 15 has stalled, and a stall
    # costs the whole limit before anyone can rerun it.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      # A read-only token, so the submodules fetch even when they are private.
      - id: submodule_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          repositories: ephyra,homelab-core,homelab-player,binge-design-system,binge-ci
          permission-contents: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.submodule_token.outputs.token }}
          submodules: recursive
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: true

      - name: Validate screenshots (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          mapfile -t filters < <(.github/scripts/shard-screenshots.sh "$SHARDS" "$SHARD")
          if [ "${#filters[@]}" -eq 0 ]; then
            echo "shard $SHARD has no classes; an empty filter would run the whole suite in one JVM (#552)" >&2
            exit 1
          fi
          printf '%s\n' "${filters[@]}" | paste - - | sed 's/^/  /'
          ./gradlew :app:validateDebugScreenshotTest --continue "${filters[@]}"

      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-reports-screenshots-${{ matrix.shard }}
          path: |
            **/build/outputs/screenshotTest-results/**/diffs/**
          if-no-files-found: ignore
          retention-days: 1

  # The release build: R8 with this app's keep rules, and lint-vital. A keep rule that no longer
  # compiles fails here on the PR, not on the next tag.
  release:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # A read-only token, so the submodules fetch even when they are private.
      - id: submodule_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          repositories: ephyra,homelab-core,homelab-player,binge-design-system,binge-ci
          permission-contents: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.submodule_token.outputs.token }}
          submodules: recursive
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: true

      - name: Assemble the release build
        run: ./gradlew assembleRelease --continue

      # The ring log keeps a frame only if it starts with this app's package, which `-keepnames` in companion.keep holds. The minified
      # debug build is not obfuscated, so only this build's mapping shows a rule that stopped working.
      - name: Check R8 kept this app's class names
        run: .github/scripts/check-r8-names.sh app/build/outputs/mapping/release/mapping.txt

      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-reports-release
          path: |
            **/build/reports/lint-results-*.html
            **/build/outputs/mapping/**/missing_rules.txt
          if-no-files-found: ignore
          retention-days: 1

  # The check branch protection requires, and the job the bots read through this workflow's
  # conclusion. Green only when every job it needs is green; `always()` so a failure upstream still reaches
  # the merge step instead of skipping this job, which would read as "not run" rather than red.
  build:
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs: [submodule-pins, actionlint, changes, checks, tests, screenshots, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The four jobs' reports as the one artifact author-ci-fix downloads by name. Artifact names
      # must be unique within a run, so each job uploads its own and they are merged here.
      - name: Merge reports
        if: ${{ contains(needs.*.result, 'failure') }}
        uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-reports
          pattern: build-reports-*
          delete-merged: true
          retention-days: ${{ github.event_name == 'schedule' && 7 || 1 }}
        continue-on-error: true

      # The pin check is skipped outside a pull request, and actionlint on the nightly schedule, so
      # a skip passes for those two alone. `changes` must have passed: without its answers a skipped
      # job could be a failure to classify, not a decision. A job `changes` said to run must have
      # succeeded; one it said to skip must have been skipped.
      - name: Fail unless every job passed
        env:
          PINS: ${{ needs.submodule-pins.result }}
          ACTIONLINT: ${{ needs.actionlint.result }}
          CHANGES: ${{ needs.changes.result }}
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.tests.result }}
          SCREENSHOTS: ${{ needs.screenshots.result }}
          RELEASE: ${{ needs.release.result }}
          RUN_PRODUCT: ${{ needs.changes.outputs.product }}
          RUN_SCREENS: ${{ needs.changes.outputs.screens }}
          RUN_RELEASE: ${{ needs.changes.outputs.release }}
        run: |
          echo "submodule-pins: $PINS; actionlint: $ACTIONLINT; changes: $CHANGES (product $RUN_PRODUCT, screens $RUN_SCREENS, release $RUN_RELEASE)"
          echo "checks: $CHECKS; tests: $TESTS; screenshots: $SCREENSHOTS; release: $RELEASE"
          [ "$PINS" = success ] || [ "$PINS" = skipped ] || exit 1
          [ "$ACTIONLINT" = success ] || [ "$ACTIONLINT" = skipped ] || exit 1
          [ "$CHANGES" = success ] || exit 1
          # An empty or odd answer is a classifier that failed, not a deliberate skip.
          for answer in "$RUN_PRODUCT" "$RUN_SCREENS" "$RUN_RELEASE"; do
            [ "$answer" = true ] || [ "$answer" = false ] || exit 1
          done
          # wanted <result> <whether changes said to run it>
          wanted() {
            if [ "$2" = true ]; then [ "$1" = success ]; else [ "$1" = skipped ]; fi
          }
          wanted "$CHECKS" "$RUN_PRODUCT" || exit 1
          wanted "$TESTS" "$RUN_PRODUCT" || exit 1
          wanted "$SCREENSHOTS" "$RUN_SCREENS" || exit 1
          wanted "$RELEASE" "$RUN_RELEASE" || exit 1

  # Lints the workflow files, which is where a typo turns into a silent startup_failure. It lives
  # in this workflow rather than its own so there is still one required check to keep in sync with
  # branch protection, and it runs on workflow-only diffs because this repo has no paths-ignore.
  # actionlint cannot see across a `uses:` reference to a reusable workflow, so the callers'
  # permissions are still proved by running them.
  actionlint:
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # binge-ci's shared step: a pinned release verified against its published checksum, with
      # shellcheck at warning severity.
      - uses: ScottCooper92/binge-ci/.github/actions/actionlint@c34892a468b77ebc2f92ef7ec716e27ad5c50d69 # v1.0.50

  # A red nightly has no PR or push to carry it, so without this it is a red mark in the
  # Actions tab that nothing points at. One issue stays open while the canary is red and
  # closes itself on the next green run, so an open one means "still broken", not "old".
  # Anything but success reports: a job that hits its timeout is `cancelled`, not `failure`, and the
  # nightly has its own concurrency group, so nothing else supersedes it.
  nightly-report:
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: ScottCooper92/binge-ci/.github/actions/nightly-report@c34892a468b77ebc2f92ef7ec716e27ad5c50d69 # v1.0.50
        with:
          result: ${{ needs.build.result }}
          title: Nightly CI is failing on main
          note: >-
            Nothing was pushed to cause this, so suspect the environment first: a runner image or
            Android SDK update, or a toolchain drift. The build-reports artifact is kept for seven days.
