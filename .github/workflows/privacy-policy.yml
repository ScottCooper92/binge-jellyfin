name: Privacy policy

# The policy's source is docs/listing/privacy.md. It is reviewed with the code, and the page people read lives
# in the ScottCooper92/app-feedback repository (https://scottcooper92.github.io/app-feedback/ephyra/privacy/),
# next to the other apps' policies. Whenever privacy.md changes on main, this opens a pull request on that
# repository that replaces the body of docs/ephyra/privacy/index.md. The page's front matter and its
# "Last updated / Change history" header stay as that repository has them, and the date is set to the day the
# source last changed. A person merges that pull request, so nothing goes live unreviewed.
#
# The pull request is opened with a short-lived token minted from the author bot's GitHub App, limited to
# app-feedback. It needs the app installed on that repository with contents and pull requests write
# access. No personal token is used. There is one branch, `ephyra-privacy-policy`, which is force-pushed each
# run, so a second change before the first is merged updates the open pull request instead of opening another.
on:
  push:
    branches: [main]
    paths:
      - docs/listing/privacy.md
      - .github/workflows/privacy-policy.yml
  workflow_dispatch:

# One run at a time, and a newer run waits rather than cancelling one that is pushing.
concurrency:
  group: privacy-policy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history, so the last-updated date is that of the last commit to change the policy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.AUTHOR_APP_ID }}
          private-key: ${{ secrets.AUTHOR_APP_PRIVATE_KEY }}
          repositories: app-feedback
          permission-contents: write
          permission-pull-requests: write

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SOURCE: docs/listing/privacy.md
          TARGET_REPO: ScottCooper92/app-feedback
          PAGE: docs/ephyra/privacy/index.md
          BRANCH: ephyra-privacy-policy
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          set -euo pipefail
          head -n 1 "$SOURCE" | grep -q '^# ' || {
            echo "::error file=$SOURCE::The policy must start with a '# ' heading"
            exit 1
          }
          updated=$(git log -1 --format=%cs -- "$SOURCE")

          git clone --quiet --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git" feedback
          page="feedback/${PAGE}"
          test -f "$page" || {
            echo "::error::${TARGET_REPO} has no ${PAGE} to update"
            exit 1
          }
          # The header is everything up to and including the "Last updated" line: front matter, heading, date.
          line=$(grep -n '^\*Last updated ' "$page" | head -n 1 | cut -d: -f1)
          test -n "$line" || {
            echo "::error::${PAGE} has no 'Last updated' line to keep"
            exit 1
          }
          # The source's heading and the blank line after it are the page's header already.
          tail -n +3 "$SOURCE" > body.md
          tail -n +"$((line + 1))" "$page" | sed '1{/^$/d}' > current.md
          if cmp -s body.md current.md; then
            echo "The page already has this policy."
            exit 0
          fi
          {
            head -n "$line" "$page" | sed "s/^\*Last updated [0-9-]*\./*Last updated ${updated}./"
            printf '\n'
            cat body.md
          } > new.md
          mv new.md "$page"

          cd feedback
          git config user.name "ephyra-privacy-bot"
          git config user.email "ephyra-privacy-bot@users.noreply.github.com"
          git checkout --quiet -B "$BRANCH"
          git add "$PAGE"
          git commit --quiet -m "docs: update the Ephyra privacy policy"
          git push --quiet --force origin "$BRANCH"

          if [ -n "$(gh pr list --repo "$TARGET_REPO" --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            echo "The open pull request now carries this policy."
          else
            gh pr create --repo "$TARGET_REPO" --base main --head "$BRANCH" \
              --title "docs: update the Ephyra privacy policy" \
              --body "The app's policy changed. The source is docs/listing/privacy.md in the app's repository, changed in ${COMMIT_URL}. This replaces the body of the page and sets its last-updated date; the front matter and header are as they were."
          fi
