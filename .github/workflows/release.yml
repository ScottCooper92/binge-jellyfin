name: Release

# Pushing a version tag (`git tag v0.1.0 && git push origin v0.1.0`) builds a signed release bundle
# and attaches it, with the R8 mapping, to a GitHub Release for that tag. The last step uploads the
# bundle and the mapping to Play's internal testing track (`internal`), as a completed release with
# its changes left unsent for review. Internal testing reaches only the testers listed in the Play
# Console and never reaches production on its own.
#
# The upload skips with a notice, and the release still succeeds, when PLAY_SERVICE_ACCOUNT_JSON is
# not set. It runs last, so a Play failure cannot withhold the bundle from the GitHub Release.
# If Play refuses `completed` for an app it has not published yet ("Only releases with status draft
# may be created on draft app"), switch `status` to `draft` until the first review has passed, as
# binge-seerr did.
#
# Once, in the Play Console, before the first upload can work: create the app for
# `com.cooper.binge.companion.ephyra`; upload the first bundle by hand if Play asks for it; invite the
# service account (the email in PLAY_SERVICE_ACCOUNT_JSON) under Users and permissions with permission
# to release to testing tracks. docs/listing/README.md ("The release upload") has the steps.
#
# The keystore is the upload key, held in secrets and never in the repository:
#   RELEASE_KEYSTORE_BASE64  base64 -w0 release.keystore
#   RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
# app/build.gradle.kts reads the four RELEASE_* values from the environment.
#
# Remote Config needs the Firebase app's config, also held in secrets and gitignored:
#   GOOGLE_SERVICES_JSON_BASE64  base64 -w0 app/google-services.json
# The google-services plugin applies only when that file exists, so without it a release would
# quietly ship with every remote flag at its default. The step that writes it fails instead.
#
# Usage data goes to PostHog, whose project key and host are secrets too (the key is not secret in the app, but it is
# configuration, and a fork must not report into this project):
#   POSTHOG_API_KEY, POSTHOG_HOST
#
# The Play upload reads the service account's key from the secret PLAY_SERVICE_ACCOUNT_JSON.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build the signed bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Write the Firebase config
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 is not set, so the release would have no Remote Config."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      - name: Verify
        run: ./gradlew build

      - name: Derive the version from the tag
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' yields versionName '$version', which is not semver."
            exit 1
          fi
          # The run number keeps versionCode monotonic across tags without a counter to maintain;
          # the offset stays clear of anything uploaded by hand.
          code=$((GITHUB_RUN_NUMBER + 100))
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "versionName=$version versionCode=$code"

      - name: Decode the release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set, so there is no upload key to sign with."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Build the release bundle
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          # PostHog's project key and host, built in. A blank key means no analytics client, so a release made without them
          # still builds and simply reports nothing.
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: ./gradlew :app:bundleRelease

      # A bundle signed with the debug key, or one R8 did not shrink, must never be attached.
      - name: Verify the bundle is release-signed and shrunk
        shell: bash
        run: |
          set -euo pipefail
          aab="app/build/outputs/bundle/release/app-release.aab"
          mapping="app/build/outputs/mapping/release/mapping.txt"
          [ -s "$aab" ] || { echo "::error::$aab is missing or empty."; exit 1; }
          [ -s "$mapping" ] || { echo "::error::$mapping is missing or empty: R8 produced no mapping."; exit 1; }
          out=$(jarsigner -verify -verbose -certs "$aab" 2>&1) || { echo "::error::jarsigner could not verify $aab."; echo "$out"; exit 1; }
          grep -q "jar verified" <<<"$out" || { echo "::error::$aab is not signed."; echo "$out"; exit 1; }
          if grep -qiE "CN=Android Debug" <<<"$out"; then
            echo "::error::$aab is signed with the debug certificate: the RELEASE_* secrets did not reach the build."
            exit 1
          fi
          echo "Bundle is release-signed; mapping present ($(wc -c < "$mapping") bytes)."

      - name: Attach the bundle and mapping to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          app/build/outputs/bundle/release/app-release.aab
          app/build/outputs/mapping/release/mapping.txt
          --title "$GITHUB_REF_NAME" --generate-notes

      # Secrets are not available to a step's `if`, so the check runs in a step of its own.
      - name: Check for the Play service account
        id: play
        shell: bash
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set, so the bundle was not uploaded to Play. Upload $GITHUB_REF_NAME by hand from the GitHub Release."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

      # Last, so a Play failure cannot withhold the bundle from the GitHub Release.
      - name: Upload to Play's internal testing track
        if: steps.play.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.cooper.binge.companion.ephyra
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          tracks: internal
          status: completed
          # Play will not send changes for review through the API (binge-seerr's v0.3.0 upload failed on it), so the
          # edit is committed unsent and the release is sent for review from the Play Console.
          changesNotSentForReview: true
