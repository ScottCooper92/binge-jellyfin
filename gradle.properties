# The daemon's defaults are sized for a plain JVM build. This one configures AGP, the Kotlin
# compiler and two included builds in one process, and without a Metaspace ceiling above the
# default it thrashes on `OutOfMemoryError: Metaspace` instead of failing.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# Compose Preview Screenshot Testing. The flag makes AGP create the screenshotTest source set; the
# heap override is for the forked render and validate JVMs, which die inside layoutlib on Gradle's
# 512m default. Both match the design system and binge-seerr, so a baseline renders the same in each.
android.experimental.enableScreenshotTest=true
android.compose.screenshot.maxHeapSize=2g
